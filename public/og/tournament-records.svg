<?xml version="1.0" encoding="utf-8"?>
<!-- Generic Tournament Records OG SVG — Green background, yellow accents, bold CTA -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#0C7A2A"/>
      <stop offset="100%" stop-color="#1EC85A"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" x2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>

    <style>
      .title{font-family: Inter, Arial, sans-serif; font-weight:900; fill:#fff}
      .subtitle{font-family: Inter, Arial, sans-serif; fill:#fff; opacity:0.95}
      .cta{font-family: Inter, Arial, sans-serif; font-weight:900; fill:#0B3B66}
      .small{font-family: Inter, Arial, sans-serif; fill:#fff; opacity:0.9}
      .brand{font-family: Inter, Arial, sans-serif; font-size:14px; fill:rgba(255,255,255,0.9)}
    </style>
  </defs>

  <!-- Main Green Background -->
  <rect width="1200" height="630" fill="url(#bg)" rx="20" />

  <!-- Aggressive yellow boxes and accents -->
  <rect x="60" y="60" width="480" height="220" rx="18" fill="url(#yellow)" opacity="0.95" />
  <rect x="680" y="120" width="420" height="300" rx="18" fill="url(#yellow)" opacity="0.9" />

  <!-- Big title on top of yellow box -->
  <g transform="translate(90,120)">
    <text x="0" y="0" class="title" font-size="64">RECORDS</text>
    <text x="0" y="70" class="subtitle" font-size="24">Top tournament stats</text>
  </g>

  <!-- Bold CTA in contrasting yellow pill with dark text -->
  <g transform="translate(90,260)">
    <rect x="0" y="0" width="520" height="120" rx="24" fill="#fff" opacity="0.0" />
    <rect x="0" y="0" width="420" height="96" rx="18" fill="#FFD700" />
    <text x="32" y="60" class="cta" font-size="34">SEE RECORDS NOW &#187;</text>
    <text x="32" y="92" class="small" font-size="18">Click to explore top players and stats</text>
  </g>

  <!-- Right-side bold icon for extra emphasis -->
  <g transform="translate(820,80)">
    <circle cx="120" cy="120" r="120" fill="#fff" opacity="0.12" />
    <rect x="40" y="40" width="160" height="160" rx="20" fill="#FFD700" />
    <text x="120" y="140" text-anchor="middle" font-size="88" fill="#0B3B66" font-family="Inter, Arial, sans-serif" font-weight="900">🏆</text>
  </g>

  <!-- Footer brand -->
  <text x="980" y="600" class="brand">TennisMyLife</text>
</svg>