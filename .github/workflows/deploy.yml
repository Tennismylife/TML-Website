name: Build & Deploy Next.js Project (Prisma 6)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Generate Prisma Client
      - name: Prisma generate
        run: npx prisma generate

      # 5️⃣ Build Next.js
      - name: Build project
        run: npm run build

      # 6️⃣ Deploy all repository files (excluding node_modules) to VPS
      - name: Deploy full repository to VPS
        run: |
          echo "${{ secrets.VPS_KEY }}" > /tmp/vps_key
          chmod 600 /tmp/vps_key

          rsync -avz --delete \
            --exclude "node_modules" \
            -e "ssh -i /tmp/vps_key -o StrictHostKeyChecking=no" \
            ./ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/TML-Website

      # 7️⃣ Install production dependencies on VPS
      - name: Install Node Modules on VPS
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            cd /var/www/TML-Website
            npm ci --omit=dev
            npx prisma generate

      # 8️⃣ Restart PM2 safely
      - name: Restart PM2
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            cd /var/www/TML-Website
            pm2 describe TML-Website > /dev/null \
              && pm2 restart TML-Website \
              || pm2 start npm --name TML-Website -- start
            pm2 save
