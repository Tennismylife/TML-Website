name: Build & Deploy Next.js Project (Prisma 6)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      # 1?? Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2?? Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 3?? Clean install Prisma 6 e Next.js aggiornato
      - name: Install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm uninstall prisma @prisma/client next || true
          npm install prisma@6 --save-dev
          npm install @prisma/client@6
          npm install next@latest
          npm install
          npx prisma generate
          npm ls prisma
          npm ls @prisma/client
          npm ls next

      # 4?? Build Next.js
      - name: Build project
        run: npm run build

      # 5?? Copy project to VPS via rsync
      - name: Deploy files to VPS
        run: |
          echo "${{ secrets.VPS_KEY }}" > /tmp/vps_key
          chmod 600 /tmp/vps_key

          rsync -avz --delete \
            --exclude "node_modules" \
            --exclude ".git" \
            -e "ssh -i /tmp/vps_key -o StrictHostKeyChecking=no" \
            .next public package.json package-lock.json prisma/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/TML-Website

      # 6?? Install node_modules on VPS (production only)
      - name: Install Node Modules on VPS
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            cd /var/www/TML-Website
            npm ci --omit=dev
            npx prisma generate

      # 7?? Restart PM2
      - name: Restart PM2
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            cd /var/www/TML-Website
            pm2 start npm --name TML-Website -- start || pm2 restart TML-Website
            pm2 save
