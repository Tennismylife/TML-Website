name: Restart Desktop Commander Once

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'ops/dc-trigger.txt'

permissions:
  contents: read

jobs:
  restart-desktop-commander:
    runs-on: ubuntu-latest
    steps:
      - name: Restart existing Desktop Commander remote service
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            sudo systemctl restart desktop-commander-remote.service
            sudo systemctl is-active desktop-commander-remote.service
