name: Temporary sitemap deploy

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  deploy-sitemaps:
    if: github.head_ref == 'deploy-usopen-sitemap'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
      - name: Deploy sitemap files only
        run: |
          echo "${{ secrets.VPS_KEY }}" > /tmp/vps_key
          chmod 600 /tmp/vps_key
          rsync -avz \
            -e "ssh -i /tmp/vps_key -o StrictHostKeyChecking=no" \
            public/sitemaps/sitemap-h2h-us-open-2026-r128-r64-noindex.xml \
            public/sitemaps/sitemap_index.xml \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/TML-Website/public/sitemaps/
