name: VPS Recovery Watchdog

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      login_test:
        description: 'Test IONOS login/server selection without confirming restart'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: vps-recovery-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WATCHDOG_ARMED: 'true'
      WATCHDOG_HOST: '82.165.11.122'
      WATCHDOG_PORT: '2222'
      IONOS_USER: ${{ secrets.IONOS_USER }}
      IONOS_PASSWORD: ${{ secrets.IONOS_PASSWORD }}
      IONOS_TOTP_SECRET: ${{ secrets.IONOS_TOTP_SECRET }}
      IONOS_SERVER_MATCH: '82.165.11.122'
    steps:
      - name: Validate configuration
        id: config
        shell: bash
        run: |
          missing=0
          for v in IONOS_USER IONOS_PASSWORD IONOS_TOTP_SECRET; do
            if [ -z "${!v:-}" ]; then echo "Missing GitHub Secret: $v"; missing=1; fi
          done
          if [ "$missing" -eq 1 ]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then exit 2; fi
            echo 'Scheduled run exits safely because IONOS credentials are not configured.'
            exit 0
          fi
          echo 'configured=true' >> "$GITHUB_OUTPUT"

      - name: Check VPS reachability
        id: health
        if: ${{ steps.config.outputs.configured == 'true' && env.WATCHDOG_ARMED == 'true' && (github.event_name == 'schedule' || inputs.login_test != true) }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, socket, time
          host=os.environ['WATCHDOG_HOST']; port=int(os.environ['WATCHDOG_PORT']); ok=False
          for i in range(1,6):
              try:
                  with socket.create_connection((host,port),timeout=5):
                      print(f'Health check {i}/5: reachable'); ok=True; break
              except OSError as e:
                  print(f'Health check {i}/5: unreachable ({type(e).__name__})')
                  if i<5: time.sleep(15)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('down=' + ('false' if ok else 'true') + '\n')
          PY

      - name: Stop when healthy
        if: ${{ steps.config.outputs.configured == 'true' && env.WATCHDOG_ARMED == 'true' && github.event_name == 'schedule' && steps.health.outputs.down == 'false' }}
        run: echo 'VPS is reachable; no action required.'

      - name: Checkout recovery code
        if: ${{ steps.config.outputs.configured == 'true' && (github.event_name == 'workflow_dispatch' || (env.WATCHDOG_ARMED == 'true' && steps.health.outputs.down == 'true')) }}
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: ${{ steps.config.outputs.configured == 'true' && (github.event_name == 'workflow_dispatch' || (env.WATCHDOG_ARMED == 'true' && steps.health.outputs.down == 'true')) }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright library
        if: ${{ steps.config.outputs.configured == 'true' && (github.event_name == 'workflow_dispatch' || (env.WATCHDOG_ARMED == 'true' && steps.health.outputs.down == 'true')) }}
        run: |
          cd ops/vps-recovery
          npm install --no-audit --no-fund
          google-chrome --version

      - name: Test IONOS login only
        if: ${{ steps.config.outputs.configured == 'true' && (github.event_name == 'workflow_dispatch' && inputs.login_test == true) }}
        env:
          DRY_RUN: 'true'
        run: node ops/vps-recovery/restart-ionos.mjs

      - name: Re-check before restart
        id: recheck
        if: ${{ steps.config.outputs.configured == 'true' && env.WATCHDOG_ARMED == 'true' && github.event_name == 'schedule' && steps.health.outputs.down == 'true' }}
        run: |
          python3 - <<'PY'
          import os,socket,time
          host=os.environ['WATCHDOG_HOST']; port=int(os.environ['WATCHDOG_PORT']); ok=False
          for i in range(3):
              try:
                  with socket.create_connection((host,port),timeout=5): ok=True; break
              except OSError:
                  if i<2: time.sleep(10)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('still_down=' + ('false' if ok else 'true') + '\n')
          print('Second-stage check:', 'still down' if not ok else 'reachable again')
          PY

      - name: Restart VPS from IONOS Cloud Panel
        if: ${{ steps.config.outputs.configured == 'true' && env.WATCHDOG_ARMED == 'true' && github.event_name == 'schedule' && steps.health.outputs.down == 'true' && steps.recheck.outputs.still_down == 'true' }}
        env:
          DRY_RUN: 'false'
        run: node ops/vps-recovery/restart-ionos.mjs

      - name: Wait for VPS to return
        if: ${{ steps.config.outputs.configured == 'true' && env.WATCHDOG_ARMED == 'true' && github.event_name == 'schedule' && steps.health.outputs.down == 'true' && steps.recheck.outputs.still_down == 'true' }}
        run: |
          sleep 60
          python3 - <<'PY'
          import os,socket,time,sys
          host=os.environ['WATCHDOG_HOST']; port=int(os.environ['WATCHDOG_PORT'])
          for i in range(1,17):
              try:
                  with socket.create_connection((host,port),timeout=5): print(f'VPS reachable again on recovery check {i}/16'); sys.exit(0)
              except OSError:
                  print(f'Recovery check {i}/16: still unreachable')
                  if i<16: time.sleep(30)
          raise SystemExit('VPS did not return within the recovery window')
          PY
